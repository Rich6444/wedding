<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emma &amp; James – Wedding Invitation</title>
<meta name="description" content="You’re invited to celebrate our wedding.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400;1,6..96,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#1F3A2E; --forest-2:#2B4D3E; --paper:#F4F6F1; --sage:#DCE4D6;
  --rose:#E4C3BC; --rose-2:#D6A9A1; --gold:#A8864A; --ink:#22302A;
  --serif:"Bodoni Moda",Georgia,serif; --sans:"Jost",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);font-weight:300;color:var(--ink);background:var(--paper);line-height:1.7;overflow-x:hidden}
body.locked{overflow:hidden;height:100svh}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.1}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ---------- Envelope intro ---------- */
.stage{position:fixed;inset:0;z-index:50;background:var(--forest);display:grid;place-items:center;
  transition:transform 1.2s cubic-bezier(.75,0,.2,1)}
.stage.gone{transform:translateY(-100%)}
.stage-inner{text-align:center;color:var(--sage)}
.env{position:relative;width:min(84vw,420px);aspect-ratio:7/5;margin:0 auto;border:0;background:none;cursor:pointer;padding:0;display:block}
.env>*{position:absolute}
.env .back{inset:0;background:var(--rose-2);border-radius:4px;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.env .card{left:7%;right:7%;top:7%;bottom:7%;background:var(--paper);z-index:2;display:grid;place-content:center;
  color:var(--forest);font-family:var(--serif);font-style:italic;font-size:clamp(1.1rem,4.5vw,1.6rem);
  transition:transform 1s cubic-bezier(.3,.7,.2,1) .55s}
.env .pocket{inset:0;z-index:3;background:var(--rose);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);border-radius:4px}
.env .flap{left:0;right:0;top:0;height:58%;z-index:4;background:var(--rose-2);clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top;transition:transform .7s ease,z-index 0s .35s}
.env .seal{left:50%;top:58%;width:19%;aspect-ratio:1;translate:-50% -50%;z-index:5;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#c9a45f,var(--gold));color:#fff;display:grid;place-items:center;
  font-family:var(--serif);font-style:italic;font-size:clamp(.8rem,3vw,1.1rem);box-shadow:0 4px 10px rgba(0,0,0,.3);
  transition:opacity .3s,scale .3s}
.env:hover .seal,.env:focus-visible .seal{scale:1.08}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .seal{opacity:0;scale:.6}
.env.open .card{transform:translateY(-62%)}
.hint{margin-top:2.2rem;letter-spacing:.2em;font-size:.8rem;text-transform:none;opacity:.8;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* ---------- Hero ---------- */
.hero{min-height:100svh;display:grid;place-content:center;text-align:center;padding:4rem 1.5rem;position:relative;overflow:hidden}
.hero .pre{font-size:1rem;letter-spacing:.12em;color:var(--gold);margin-bottom:1.5rem}
.names{font-style:italic;font-size:clamp(3.4rem,13vw,9rem);color:var(--forest);letter-spacing:-.01em}
.names span{display:inline-block;opacity:0;transform:translateY(40px)}
.names .amp{font-size:.55em;color:var(--rose-2);margin:0 .15em}
.in .names span{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.in .names span:nth-child(2){animation-delay:.2s}
.in .names span:nth-child(3){animation-delay:.4s}
@keyframes rise{to{opacity:1;transform:none}}
.hero .when,.hero .where,.count{opacity:0}
.in .when,.in .where,.in .count{animation:fade 1s ease 1s forwards}
.in .where{animation-delay:1.15s}.in .count{animation-delay:1.4s}
@keyframes fade{to{opacity:1}}
.when{font-family:var(--serif);font-size:clamp(1.2rem,3.5vw,1.7rem);margin-top:2rem}
.where{margin-top:.3rem;font-size:1.05rem}
.count{display:flex;justify-content:center;gap:clamp(1rem,4vw,2.5rem);margin-top:3rem}
.count div{min-width:4.2rem}
.count b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(2rem,7vw,3rem);color:var(--forest);font-variant-numeric:tabular-nums}
.count small{font-size:.85rem;color:var(--gold)}
.petal{position:absolute;top:-30px;width:14px;height:18px;border-radius:80% 0 80% 0;background:var(--rose);opacity:.7;
  animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg)}}

/* ---------- Sections ---------- */
section{padding:6rem 1.5rem}
.wrap{max-width:860px;margin:0 auto}
h2{font-size:clamp(2rem,6vw,3.2rem);font-style:italic;color:var(--forest);text-align:center;margin-bottom:3rem}
.details{background:var(--sage)}
.cols{display:grid;grid-template-columns:1fr 1px 1fr;gap:2.5rem;text-align:center}
.cols hr{border:0;background:var(--forest);opacity:.25}
.cols h3{font-size:1.7rem;font-style:italic;color:var(--forest);margin-bottom:.8rem}
.cols p{margin-bottom:.3rem}
.cols .big{font-family:var(--serif);font-size:1.3rem;margin-bottom:.6rem}
.link{display:inline-block;margin-top:.8rem;color:var(--forest);text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:2px;transition:color .2s,border-color .2s}
.link:hover{color:var(--gold)}
.note{text-align:center;margin-top:3rem}
.btn{font:inherit;font-weight:400;cursor:pointer;border:1px solid var(--forest);background:transparent;color:var(--forest);
  padding:.85rem 2rem;border-radius:99px;transition:background .25s,color .25s,transform .25s}
.btn:hover{background:var(--forest);color:var(--paper);transform:translateY(-2px)}
.btn.solid{background:var(--forest);color:var(--paper)}
.btn.solid:hover{background:var(--forest-2)}

/* Timeline */
.tl{position:relative;margin:0 auto;max-width:560px;padding-left:2rem}
.tl::before{content:"";position:absolute;left:.45rem;top:.4rem;bottom:.4rem;width:1px;background:var(--gold);opacity:.5}
.tl li{list-style:none;position:relative;padding-bottom:2.2rem;opacity:0;transform:translateX(-18px);transition:opacity .7s,transform .7s}
.tl li.seen{opacity:1;transform:none}
.tl li::before{content:"";position:absolute;left:-1.85rem;top:.55rem;width:.7rem;height:.7rem;border-radius:50%;background:var(--paper);border:1px solid var(--gold);transition:background .4s .3s}
.tl li.seen::before{background:var(--gold)}
.tl time{font-family:var(--serif);font-style:italic;font-size:1.25rem;color:var(--forest)}
.tl h3{font-family:var(--sans);font-size:1.05rem;font-weight:500}

/* RSVP */
.rsvp{background:var(--forest);color:var(--sage)}
.rsvp h2{color:var(--paper)}
form{max-width:520px;margin:0 auto;display:grid;gap:1.3rem}
label{display:grid;gap:.35rem;font-size:.95rem}
input,select,textarea{font:inherit;color:var(--paper);background:rgba(255,255,255,.07);border:1px solid rgba(220,228,214,.35);border-radius:6px;padding:.75rem .9rem;transition:border-color .2s,background .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--rose);background:rgba(255,255,255,.12)}
select option{color:#222}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.choice label{cursor:pointer}
.choice input{position:absolute;opacity:0}
.choice span{display:block;text-align:center;padding:.8rem;border:1px solid rgba(220,228,214,.35);border-radius:6px;transition:all .25s}
.choice input:checked+span{background:var(--rose);color:var(--forest);border-color:var(--rose)}
.choice input:focus-visible+span{outline:2px solid var(--gold);outline-offset:3px}
.rsvp .btn.solid{background:var(--rose);color:var(--forest);border-color:var(--rose)}
.rsvp .btn.solid:hover{background:var(--paper)}
.thanks{text-align:center;display:none}
.thanks.show{display:block;animation:fade 1s forwards}
.thanks h3{font-style:italic;font-size:2.2rem;color:var(--paper);margin-bottom:.6rem}
footer{text-align:center;padding:3rem 1.5rem;font-family:var(--serif);font-style:italic;color:var(--forest);font-size:1.3rem}

@media(max-width:640px){
  .cols{grid-template-columns:1fr}.cols hr{height:1px;width:60%;margin:0 auto}
  section{padding:4.5rem 1.25rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;transition-delay:0s!important}
  .petal{display:none}
}
</style>
</head>
<body class="locked">

<!-- Envelope intro -->
<div class="stage" id="stage">
  <div class="stage-inner">
    <button class="env" id="env" aria-label="Open your invitation">
      <span class="back"></span>
      <span class="card" id="cardText"></span>
      <span class="pocket"></span>
      <span class="flap"></span>
      <span class="seal" id="seal"></span>
    </button>
    <p class="hint">Tap the seal to open</p>
  </div>
</div>

<header class="hero" id="hero">
  <p class="pre">Together with their families</p>
  <h1 class="names"><span id="n1"></span> <span class="amp">&amp;</span> <span id="n2"></span></h1>
  <p class="when" id="whenLine"></p>
  <p class="where" id="whereLine"></p>
  <div class="count" id="count" aria-live="off">
    <div><b id="cd">0</b><small>days</small></div>
    <div><b id="ch">0</b><small>hours</small></div>
    <div><b id="cm">0</b><small>minutes</small></div>
    <div><b id="cs">0</b><small>seconds</small></div>
  </div>
</header>

<section class="details" id="details">
  <div class="wrap">
    <h2>The celebration</h2>
    <div class="cols">
      <div>
        <h3>Ceremony</h3>
        <p class="big" id="cerTime"></p>
        <p id="cerPlace"></p><p id="cerAddr"></p>
        <a class="link" id="cerMap" target="_blank" rel="noopener">Get directions</a>
      </div>
      <hr>
      <div>
        <h3>Reception</h3>
        <p class="big" id="recTime"></p>
        <p id="recPlace"></p><p id="recAddr"></p>
        <a class="link" id="recMap" target="_blank" rel="noopener">Get directions</a>
      </div>
    </div>
    <p class="note" id="dress"></p>
    <p class="note"><button class="btn" id="calBtn">Add to calendar</button></p>
  </div>
</section>

<section id="schedule">
  <div class="wrap">
    <h2>The day</h2>
    <ul class="tl" id="tl"></ul>
  </div>
</section>

<section class="rsvp" id="rsvp">
  <div class="wrap">
    <h2>Will you join us?</h2>
    <form id="form">
      <label>Your name <input name="name" required autocomplete="name"></label>
      <label>Email <input name="email" type="email" required autocomplete="email"></label>
      <div class="choice">
        <label><input type="radio" name="attending" value="Joyfully accepts" required><span>Joyfully accept</span></label>
        <label><input type="radio" name="attending" value="Regretfully declines"><span>Regretfully decline</span></label>
      </div>
      <label>Number of guests
        <select name="guests"><option>1</option><option>2</option><option>3</option><option>4</option></select>
      </label>
      <label>Dietary needs <input name="diet" placeholder="Optional"></label>
      <label>A note for the couple <textarea name="note" rows="3" placeholder="Optional"></textarea></label>
      <button class="btn solid" type="submit">Send RSVP</button>
      <p id="deadline" style="text-align:center;font-size:.9rem;opacity:.8"></p>
    </form>
    <div class="thanks" id="thanks">
      <h3>Thank you!</h3>
      <p>Your RSVP is in. We can’t wait to celebrate with you.</p>
    </div>
  </div>
</section>

<footer id="foot"></footer>

<script>
/* =====================================================
   EDIT YOUR DETAILS HERE – everything on the site
   fills in from this one block.
   ===================================================== */
const W = {
  name1: "Emma",
  name2: "James",
  date: "2027-06-12T16:00:00",           // YYYY-MM-DDTHH:MM:SS (24h, local time)
  ceremony:  { time: "4:00 PM", place: "Willowbrook Gardens", address: "123 Garden Lane, Philadelphia, PA" },
  reception: { time: "6:00 PM", place: "The Grand Hall",      address: "456 Main Street, Philadelphia, PA" },
  dress: "Dress code: garden formal",
  rsvpBy: "May 1, 2027",
  schedule: [
    { time: "3:30 PM", title: "Guests arrive", note: "Find a seat and enjoy a welcome drink" },
    { time: "4:00 PM", title: "Ceremony",      note: "Under the willow trees" },
    { time: "5:00 PM", title: "Cocktail hour", note: "Drinks and canapés on the lawn" },
    { time: "6:00 PM", title: "Dinner",        note: "Reception begins at The Grand Hall" },
    { time: "8:00 PM", title: "First dance",   note: "Then the dance floor opens" },
    { time: "11:00 PM", title: "Send-off",     note: "Sparklers and goodnights" }
  ],
  rsvpEmail: "you@example.com",           // used if no form service below
  formEndpoint: ""                         // optional: paste a Formspree URL to receive RSVPs by email
};
/* ===================================================== */

const $ = id => document.getElementById(id);
const when = new Date(W.date);
const dateLong = when.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
const mapUrl = a => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(a);

document.title = `${W.name1} & ${W.name2} – Wedding Invitation`;
$("n1").textContent = W.name1; $("n2").textContent = W.name2;
$("cardText").textContent = `${W.name1} & ${W.name2}`;
$("seal").textContent = W.name1[0] + W.name2[0];
$("whenLine").textContent = dateLong;
$("whereLine").textContent = `${W.ceremony.place}, ${W.ceremony.address.split(",").slice(-2).join(",").trim()}`;
$("cerTime").textContent = W.ceremony.time;   $("recTime").textContent = W.reception.time;
$("cerPlace").textContent = W.ceremony.place; $("recPlace").textContent = W.reception.place;
$("cerAddr").textContent = W.ceremony.address;$("recAddr").textContent = W.reception.address;
$("cerMap").href = mapUrl(W.ceremony.address);$("recMap").href = mapUrl(W.reception.address);
$("dress").textContent = W.dress;
$("deadline").textContent = `Kindly reply by ${W.rsvpBy}`;
$("foot").textContent = `${W.name1} & ${W.name2} · ${when.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})}`;
$("tl").innerHTML = W.schedule.map(s =>
  `<li><time>${s.time}</time><h3>${s.title}</h3><p>${s.note}</p></li>`).join("");

/* Envelope → site */
const env = $("env"), stage = $("stage");
function openInvite(){
  if (env.classList.contains("open")) return;
  env.classList.add("open");
  setTimeout(()=>{
    stage.classList.add("gone");
    document.body.classList.remove("locked");
    $("hero").classList.add("in");
    petals();
  }, 1900);
  setTimeout(()=>stage.style.display="none", 3300);
}
env.addEventListener("click", openInvite);

/* Falling petals (one-time ambient moment in the hero) */
function petals(){
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const h = $("hero");
  for (let i=0;i<16;i++){
    const p = document.createElement("i");
    p.className = "petal";
    p.style.left = Math.random()*100 + "%";
    p.style.setProperty("--dx", (Math.random()*160-80) + "px");
    p.style.animationDuration = (7 + Math.random()*6) + "s";
    p.style.animationDelay = (Math.random()*4) + "s";
    p.style.animationIterationCount = "2";
    p.style.opacity = .4 + Math.random()*.4;
    h.appendChild(p);
    setTimeout(()=>p.remove(), 30000);
  }
}

/* Countdown */
function tick(){
  let d = when - new Date();
  if (d < 0) d = 0;
  const s = Math.floor(d/1000);
  $("cd").textContent = Math.floor(s/86400);
  $("ch").textContent = String(Math.floor(s%86400/3600)).padStart(2,"0");
  $("cm").textContent = String(Math.floor(s%3600/60)).padStart(2,"0");
  $("cs").textContent = String(s%60).padStart(2,"0");
}
tick(); setInterval(tick, 1000);

/* Timeline reveal */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting){ e.target.classList.add("seen"); io.unobserve(e.target); }
}), {threshold:.4});
document.querySelectorAll(".tl li").forEach((li,i)=>{ li.style.transitionDelay = (i%3)*80+"ms"; io.observe(li); });

/* Add to calendar (.ics download) */
$("calBtn").addEventListener("click", () => {
  const f = d => d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0")
    + "T" + String(d.getHours()).padStart(2,"0") + String(d.getMinutes()).padStart(2,"0") + "00";
  const end = new Date(when.getTime() + 6*3600*1000);
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","BEGIN:VEVENT",
    "SUMMARY:" + W.name1 + " & " + W.name2 + "’s Wedding",
    "DTSTART:" + f(when), "DTEND:" + f(end),
    "LOCATION:" + W.ceremony.place + ", " + W.ceremony.address,
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
  a.download = "wedding.ics"; a.click();
});

/* RSVP */
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  let ok = true;
  if (W.formEndpoint){
    try {
      const r = await fetch(W.formEndpoint,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(data)});
      ok = r.ok;
    } catch { ok = false; }
  } else {
    const body = Object.entries(data).map(([k,v])=>`${k}: ${v}`).join("\n");
    location.href = `mailto:${W.rsvpEmail}?subject=${encodeURIComponent("RSVP – " + data.name)}&body=${encodeURIComponent(body)}`;
  }
  if (ok){ e.target.style.display="none"; $("thanks").classList.add("show"); }
  else alert("Something went wrong sending your RSVP. Please try again or contact us directly.");
});
</script>
</body>
</html>
